name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff -r requirements_test.txt
      - run: ruff check . && ruff format --check .
      - run: pytest --cov --cov-report=term-missing
