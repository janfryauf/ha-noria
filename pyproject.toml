[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["ASYNC", "B", "C4", "D", "E", "F", "FURB", "G", "I", "PERF", "PL", "PT", "RET", "RUF", "SIM", "TRY", "UP", "W"]
ignore = [
  "D202",    # blank line after docstring
  "D203",    # conflicts with D211
  "D213",    # conflicts with D212
  "D105",    # magic method docstrings
  "D107",    # __init__ docstrings are optional
  "PLR0913", # HA signatures have many arguments
  "PLR2004", # magic values in comparisons (HTTP status codes)
  "TRY003",  # messages in exception constructors
  "TRY300",  # return in try
  "BLE001",  # broad except is deliberate in the config flow
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR0915", "PLC0415", "S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["custom_components"]
